[workspace]
resolver = "2"
members = [
    "kernel",
    "libs/karst-abi-native",
    "libs/karst-abi-posix",
    "libs/karst-mem",
]

# Warnungen sind unerledigte Arbeit: sie brechen den Bau ab, statt nur im Log
# zu stehen. Gilt ausschliesslich fuer die EIGENEN Crates (nicht fuer
# build-std/core), weil [lints] pro Paket wirkt und nicht ueber RUSTFLAGS.
[workspace.lints.rust]
warnings = "deny"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Karstos Project"]

[profile.release]
panic = "abort"
opt-level = 2
lto = true
debug = true
codegen-units = 1

[profile.dev]
panic = "abort"
opt-level = 1
debug = true
