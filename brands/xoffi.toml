# Marke: XoffiOS — zweite Marke, gleicher Quelltext.
#
# Bauen:  ./build.sh --brand xoffi
#
# Es gibt KEINEN eigenen Zweig und keinen Fork. Was sich zwischen den Marken
# unterscheidet, steht in dieser Datei und spaeter in Daten (welche Pakete im
