# Limine-Bootmenue von Karstos (Konfigurationsformat Limine 8/9).
timeout: 0
verbose: yes

/Karstos
    protocol: limine
    path: boot():/boot/karst
    # Startdateisystem: eigenes Format (siehe userland/mkinitramfs.py). Die
    # Zeichenkette daneben ist das, woran der Kernel das Modul erkennt — er
    # verlaesst sich NICHT auf einen Pfad.
    module_path: boot():/boot/initramfs.img
    module_string: initramfs
